[project]
name        = "k-nobg"
version     = "0.1.0"
description = "KπX sovereign background removal — FeyNobg semantic matting (CPU / Intel Arc / NVIDIA CUDA)"
authors     = [{ name = "KpihX", email = "kapoivha@gmail.com" }]
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    "nobg>=0.2.5",
    "loadimg>=0.1.0",
    "typer>=0.15.1",
    "rich>=15.0.0",
    "python-dotenv>=1.0.0",
]

# ── Hardware extras (mutually exclusive) ─────────────────────────────────────
# Usage: uv sync --extra cpu / --extra gpu-intel / --extra gpu-cuda
# Tool:  uv tool install k-nobg[cpu] / [gpu-intel] / [gpu-cuda]

[project.optional-dependencies]
cpu = [
    "torch>=2.0",
    "torchvision>=0.15",
]
gpu-intel = [
    "torch>=2.0",
    "torchvision>=0.15",
    "intel-extension-for-pytorch>=2.0",
    "triton-xpu>=3.8.0",
]
gpu-cuda = [
    "torch>=2.0",
    "torchvision>=0.15",
]

[project.scripts]
nobg = "k_nobg.cli:app"

[tool.uv]
package = true
index-strategy = "unsafe-best-match"
prerelease = "allow"
conflicts = [
    [{ extra = "cpu" }, { extra = "gpu-intel" }, { extra = "gpu-cuda" }],
]

# ── PyTorch indexes (explicit — only used when the matching extra is selected) ─

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-xpu", extra = "gpu-intel" },
    { index = "pytorch-cuda", extra = "gpu-cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-xpu", extra = "gpu-intel" },
    { index = "pytorch-cuda", extra = "gpu-cuda" },
]
triton-xpu = [
    { index = "pytorch-xpu", extra = "gpu-intel" },
]

[build-system]
requires      = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "k_nobg"

# ── Development dependencies ─────────────────────────────────────────────────
[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pyright",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pyright]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
